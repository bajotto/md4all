name: Build & Release (mac/win/linux)

on:
  push:
    tags:
      - 'v*' # dispara ao criar uma tag como v0.1.0
  workflow_dispatch: # permite rodar manualmente pelo GitHub Actions UI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder: npx electron-builder --mac dmg --x64 --publish never && npx electron-builder --mac dmg --arm64 --publish never
          - os: ubuntu-latest
            builder: npx electron-builder --linux --publish never
          - os: windows-latest
            builder: npx electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build do app
        run: npm run build

      # Sem assinatura: macOS usa ad-hoc (afterPack), Windows gera nsis não
      # assinado (aviso do SmartScreen), Linux AppImage/deb.
      - name: Build dos instaladores
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.builder }}

      - name: Listar dist
        run: ls -lh dist/ || true

      - name: Upload dos instaladores
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # Junta os artefatos das 3 plataformas e cria UM release (evita corrida).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar artefatos
        run: ls -lh artifacts/

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
