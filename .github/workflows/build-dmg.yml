name: Build & Release (mac/win/linux)

on:
  push:
    tags:
      - 'v*' # dispara ao criar uma tag como v0.1.0
  workflow_dispatch: # permite rodar manualmente pelo GitHub Actions UI

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write
    steps:
      - name: Deletar release anterior
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          RELEASES=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          echo "$RELEASES" | jq -r '.[] | select(.tag_name != "'"$CURRENT_TAG"'") | .id' | while read ID; do
            echo "Deletando release $ID..."
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$ID"
          done

      - name: Deletar todos os artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" \
          | jq -r '.artifacts[] | .id' | while read ID; do
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID"
          done
          echo "Cleanup completo!"

  build:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder: npx electron-builder --mac dmg --x64 --publish never && npx electron-builder --mac dmg --arm64 --publish never
          - os: ubuntu-latest
            builder: npx electron-builder --linux --publish never
          - os: windows-latest
            builder: npx electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build do app
        run: npm run build

      # Sem assinatura: macOS usa ad-hoc (afterPack), Windows gera nsis não
      # assinado (aviso do SmartScreen), Linux AppImage/deb.
      - name: Build dos instaladores
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.builder }}

      - name: Listar dist
        run: ls -lh dist/ || true

      - name: Upload para release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
