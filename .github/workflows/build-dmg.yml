name: Build & Release (mac/win/linux)

on:
  push:
    tags:
      - 'v*' # dispara ao criar uma tag como v0.1.0
  workflow_dispatch: # permite rodar manualmente pelo GitHub Actions UI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder: npx electron-builder --mac dmg --x64 --publish never && npx electron-builder --mac dmg --arm64 --publish never
          - os: ubuntu-latest
            builder: npx electron-builder --linux --publish never
          - os: windows-latest
            builder: npx electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build do app
        run: npm run build

      # Sem assinatura: macOS usa ad-hoc (afterPack), Windows gera nsis não
      # assinado (aviso do SmartScreen), Linux AppImage/deb.
      - name: Build dos instaladores
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.builder }}

      - name: Listar dist
        run: ls -lh dist/ || true

      - name: Upload para release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/*.{dmg,exe,AppImage,deb}; do
            [ -f "$file" ] && gh release upload ${GITHUB_REF#refs/tags/} "$file" --clobber || true
          done
