name: Build DMG (macOS)

on:
  push:
    tags:
      - 'v*'          # dispara ao criar uma tag como v0.1.0
  workflow_dispatch:  # permite rodar manualmente pelo GitHub Actions UI

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # Para distribuição fora da Mac App Store sem assinatura,
      # o usuário precisará desativar o Gatekeeper ou assinar com um
      # Apple Developer ID. As variáveis abaixo ficam em branco em forks
      # e a build prossegue sem assinatura (modo de desenvolvimento).
      - name: Build + DMG (x64 + arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure em Settings → Secrets para assinar:
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          # CSC_LINK (certificado .p12 em base64), CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --mac dmg --x64 --publish never
          npx electron-builder --mac dmg --arm64 --publish never

      - name: Listar artefatos
        run: ls -lh dist/

      - name: Upload DMG (x64)
        uses: actions/upload-artifact@v4
        with:
          name: md4all-dmg-x64
          path: dist/*-x64.dmg
          if-no-files-found: warn

      - name: Upload DMG (arm64 / Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: md4all-dmg-arm64
          path: dist/*-arm64.dmg
          if-no-files-found: warn

      # Cria um GitHub Release automático ao tagear
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
