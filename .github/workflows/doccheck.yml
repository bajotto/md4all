name: Doc check (determinístico, sem LLM)

# OPCIONAL e barato: roda em Linux (1x), sem chamadas LLM e sem custo de token.
# Por padrão só dispara manualmente (workflow_dispatch) para NÃO consumir minutos
# automaticamente em repositório privado. Para ativar em PRs, descomente o bloco
# pull_request abaixo.
on:
  workflow_dispatch:
  # pull_request:
  #   paths: ['**/*.md', 'src/**', 'docs/**']

jobs:
  doccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run doccheck
